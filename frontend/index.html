<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0918">
<title>Tamagotchi-Fawn | Tamagotchi FWN</title>
<link rel="stylesheet" href="/assets/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="/assets/app.js"></script>
</head>
<body>
<main class="device">
<header><span class="brand"><span class="pixel-mark">✦</span> Tamagotchi FWN</span><span class="led" aria-label="Питание"></span></header>
<section class="screen">
<div class="screen-top"><span>VIRTUAL PET / 01</span><span id="level">LVL —</span></div>
<div class="name-row"><h1 id="name">···</h1><button id="rename" aria-label="Переименовать питомца" disabled>✎</button></div>
<div class="habitat">
<span class="star s1">✦</span><span class="star s2">+</span><span class="star s3">✧</span><span class="star s4">+</span>
<div class="orbit"></div>
<img class="pet" src="/assets/pet.svg" alt="Фиолетовый пиксельный кот" width="220" height="220">
<div class="pet-shadow"></div><div class="floor"></div>
</div>
<div class="experience"><span id="xp">XP — / 100</span><progress id="xp-bar" max="100" value="0" aria-label="Опыт"></progress></div>
<section id="stats" aria-label="Показатели питомца"></section>
</section>
<section class="actions" aria-label="Уход за питомцем">
<button data-action="feed" disabled><span class="action-icon">♥</span><span>Кормить</span></button>
<button data-action="play" disabled><span class="action-icon">✚</span><span>Играть</span></button>
<button data-action="wash" disabled><span class="action-icon">◈</span><span>Купать</span></button>
<button data-action="rest" disabled><span class="action-icon">☾</span><span>Спать</span></button>
</section>
<p id="message" role="status" aria-live="polite">Загрузка…</p>
<button id="retry" hidden>Обновить состояние</button>
<details id="admin-panel" hidden>
<summary>Администрирование</summary>
<form id="admin-search">
<label for="admin-user-id">Telegram ID пользователя</label>
<div class="admin-toolbar"><input id="admin-user-id" inputmode="numeric" pattern="[1-9][0-9]*" required placeholder="123456789"><button>Найти</button></div>
</form>
<div class="admin-toolbar"><button type="button" id="admin-list">Все пользователи</button><button type="button" id="admin-next" hidden>Далее</button></div>
<div id="admin-users" aria-label="Пользователи"></div>
<form id="admin-editor" hidden>
<h3 id="admin-owner"></h3>
<p id="admin-pet-name"></p>
<div id="admin-fields"></div>
<p class="admin-hint">Уровень: 1–1 000 000. Показатели: 0–100. Опыт внутри уровня сохраняется.</p>
<div class="admin-toolbar"><button id="admin-save">Сохранить</button><button type="button" id="admin-refresh">Обновить данные</button></div>
</form>
<p id="admin-message" role="status" aria-live="polite"></p>
</details>
<footer><span>✦</span><i></i><i></i><i></i><span>✦</span></footer>
</main>
<dialog id="name-dialog" aria-labelledby="dialog-title">
<form id="name-form">
<span class="dialog-icon">✦</span>
<p class="eyebrow" id="dialog-caption">NEW PET</p>
<h2 id="dialog-title">Как его назовём?</h2>
<label for="pet-name">Имя питомца</label>
<input id="pet-name" name="name" maxlength="24" required autocomplete="off" placeholder="Например, Пиксель">
<p id="name-error" role="alert"></p>
<button type="submit" id="save-name">Сохранить</button>
<button type="button" id="cancel-name">Отмена</button>
</form>
</dialog>
</body>
</html>
